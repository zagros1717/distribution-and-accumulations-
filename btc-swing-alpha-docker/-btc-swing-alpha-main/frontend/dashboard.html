<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTC Swing Alpha</title>
  <style>
    :root{--bg:#081018;--panel:#101923;--panel2:#142131;--border:#263445;--text:#d8e2ee;--muted:#7d8b9d;--accent:#ffb000;--green:#16c784;--red:#ea3943;--gray:#8a95a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#142033 0,#081018 45%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);background:rgba(16,25,35,.92);position:sticky;top:0;z-index:2}.brand{font-weight:800;color:var(--accent)}.sub,.status,.k,.note{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--gray);margin-left:6px}.wrap{max-width:1320px;margin:0 auto;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.tabs button,.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:700}.btn:disabled{opacity:.35;cursor:not-allowed}.tabs button:hover,.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}.tabs button.active{background:rgba(255,176,0,.12);border-color:var(--accent);color:var(--accent)}.tabs button.research{opacity:.72}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:rgba(16,25,35,.96);border:1px solid var(--border);border-radius:12px;overflow:hidden}.head{padding:12px 14px;background:var(--panel2);border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;align-items:center}.body{padding:16px}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}@media(max-width:900px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}.signal{font-size:44px;font-weight:900;line-height:1.1;margin-bottom:10px}.long,.bullish{color:var(--green)}.short,.bearish{color:var(--red)}.flat,.neutral{color:var(--gray)}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}.v{font-size:18px;font-weight:800;margin-top:4px}.metric{padding:13px;border:1px solid var(--border);border-radius:10px;background:#0c1520}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metrics.wide{grid-template-columns:repeat(4,1fr)}@media(max-width:900px){.metrics.wide{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.metrics,.metrics.wide{grid-template-columns:1fr}.kv{grid-template-columns:1fr}}.err{white-space:pre-wrap;color:#ff9b9b;background:rgba(234,57,67,.08);border:1px solid rgba(234,57,67,.25);padding:14px;border-radius:10px;direction:ltr;text-align:left}.loading{padding:30px;text-align:center;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid var(--border);text-align:right}th{color:var(--muted)}canvas{width:100%;height:260px;background:#081018;border-radius:10px;border:1px solid var(--border)}.pill{padding:3px 8px;border-radius:999px;font-size:11px;background:rgba(255,255,255,.06)}.ok{color:var(--green)}.bad{color:var(--red)}.warn{border-right:3px solid var(--accent);padding:10px 12px;background:rgba(255,176,0,.08);border-radius:8px;margin-top:10px}.bar{height:8px;background:#0a121d;border-radius:999px;overflow:hidden;border:1px solid var(--border);margin-top:5px}.bar span{display:block;height:100%;background:var(--accent)}.pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.select{background:#0c1520;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px}.section-title{margin:12px 0 8px;color:var(--muted);font-size:12px}.small{font-size:11px;color:var(--muted)}
  </style>
</head>
<body>
<header><div><div class="brand">▲ BTC SWING ALPHA</div><div class="sub">Higher TF first · 1D / 4H / 1H production focus · 15m/5m research only</div></div><div class="status mono"><span id="dot" class="dot"></span><span id="clock">--:--:--</span></div></header>
<div class="wrap"><div class="tabs" id="tabs"></div><div id="app" class="grid"><div class="card c12"><div class="loading">در حال اتصال...</div></div></div><div class="card c12" style="margin-top:14px"><div class="body note"><b>هشدار:</b> این صفحه فقط برای تحلیل و تست مهندسی است، نه توصیه مالی. «معاملات» یعنی معاملات بک‌تست تاریخی، نه معامله واقعی روی حساب تو.</div></div></div>
<script>
const API = location.origin === 'null' || location.protocol === 'file:' ? 'http://127.0.0.1:8000' : location.origin;
const TFS = [['1d','روزانه · 1D','main'], ['4h','۴ ساعته · 4H','main'], ['1h','۱ ساعته · 1H','main'], ['15m','۱۵ دقیقه · research','research'], ['5m','۵ دقیقه · research','research']];
let current = localStorage.getItem('tf') || '1d'; if(!TFS.some(([tf])=>tf===current)) current='1d';
let tradePage = Number(localStorage.getItem('tradePage') || 1); let tradeLimit = Number(localStorage.getItem('tradeLimit') || 50);
let lastPipe=null,lastEquity=null,lastTrades=null,lastFeatures=null;
const app=document.getElementById('app'), dot=document.getElementById('dot');
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-GB'),1000);
function fmtNum(v,d=2){return (v===null||v===undefined||Number.isNaN(Number(v)))?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:d})}
function pct(v){return (v===null||v===undefined)?'—':(v>=0?'+':'')+Number(v).toFixed(1)+'%'}
function pct01(v){return (v===null||v===undefined)?'—':(Number(v)*100).toFixed(1)+'%'}
function px(v){return (v===null||v===undefined||Number.isNaN(Number(v)))?'—':'$'+Number(v).toLocaleString('en-US',{maximumFractionDigits:0})}
function money(v){if(v===null||v===undefined||Number.isNaN(Number(v)))return '—'; const n=Number(v); return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0})}
function clsDir(d){return d==='long'?'long':d==='short'?'short':'flat'} function pnlCls(v){return Number(v)>=0?'long':'short'}
function faDir(d){return {long:'خرید',short:'فروش',flat:'بدون پوزیشن'}[d]||d} function faRegime(r){return {expansion:'رونق',neutral:'خنثی',recession:'رکود'}[r]||r} function faClass(c){return {'0':'نزول','1':'خنثی','2':'صعود'}[String(c)] ?? c}
function faBias(b){return {bullish:'صعودی',bearish:'نزولی',neutral:'خنثی'}[b]||b||'—'}
async function api(path){const r=await fetch(API+path);const txt=await r.text();let data;try{data=JSON.parse(txt)}catch{data=txt}if(!r.ok){throw new Error((data&&data.detail)||txt||('HTTP '+r.status))}return data;}
function renderTabs(){document.getElementById('tabs').innerHTML=TFS.map(([tf,label,type])=>`<button class="${tf===current?'active':''} ${type==='research'?'research':''}" data-tf="${tf}">${label}</button>`).join('');document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{current=b.dataset.tf;localStorage.setItem('tf',current);tradePage=1;localStorage.setItem('tradePage',1);renderTabs();load(current,false)});}
async function load(tf, force=false){dot.style.background='var(--accent)';app.innerHTML=`<div class="card c12"><div class="loading">در حال اجرای pipeline برای ${tf} ...</div></div>`;try{const qs=force?'?force=true':'';const pipe=await api('/api/pipeline/'+tf+qs);const [equity,trades,features]=await Promise.all([api('/api/equity/'+tf),api(`/api/trades/${tf}?page=${tradePage}&limit=${tradeLimit}`),api('/api/features/'+tf)]);lastPipe=pipe;lastEquity=equity;lastTrades=trades;lastFeatures=features;dot.style.background='var(--green)';render(pipe,equity,trades,features);}catch(e){dot.style.background='var(--red)';app.innerHTML=`<div class="card c12"><div class="head">خطای موتور برای ${tf}</div><div class="body"><div class="err">${String(e.message||e)}</div><div class="warn note">برای تست مستقیم: <span class="mono">/api/pipeline/${tf}?force=true</span></div></div></div>`;}}
async function loadTradesPage(page){tradePage=page;localStorage.setItem('tradePage',page);try{lastTrades=await api(`/api/trades/${current}?page=${tradePage}&limit=${tradeLimit}`);render(lastPipe,lastEquity,lastTrades,lastFeatures);}catch(e){alert(String(e.message||e));}}
async function changeLimit(v){tradeLimit=Number(v);tradePage=1;localStorage.setItem('tradeLimit',tradeLimit);localStorage.setItem('tradePage',1);await loadTradesPage(1)}
function render(pipe,equity,trades,features){
  const live=pipe.live||{}, d=live.decision||{}, cmp=live.comparison||{}, v=live.verdict||{}, bias=live.model_bias||{}, market=live.market||pipe.market||{};
  const m=pipe.backtest_metrics||{}, reg=pipe.regime_now||{}, p=pipe.provenance||{}, meta=pipe.model||{}, ts=trades.summary||pipe.trade_summary||m.trade_summary||{}, pg=trades.pagination||{};
  const lift=meta.accuracy_lift_vs_baseline, modelUseful=(lift!==undefined&&lift!==null&&lift>0);
  const currentPrice = pipe.current_price ?? pipe.market_price ?? d.market_price ?? market.price ?? pipe.last_price;
  const candlePrice = pipe.candle_last_price ?? d.candle_close_price ?? p.candle_last_price ?? d.price;
  const priceSrc = pipe.price_source ?? d.price_source ?? p.price_source ?? '—';
  const gateBlocked = bias.trade_gate_blocked;
  app.innerHTML=`
<div class="card c7"><div class="head"><span>تصمیم لحظه‌ای · ${pipe.timeframe}</span><span class="mono">${live.timestamp||'—'}</span></div><div class="body"><div class="signal ${clsDir(d.direction)}">${faDir(d.direction)}</div><div class="kv">${kv('قیمت کنونی / Ticker',px(currentPrice))}${kv('Close آخرین کندل',px(candlePrice))}${kv('اختلاف با کندل',pct(pipe.price_delta_vs_candle_pct ?? d.price_delta_vs_candle_pct))}${kv('منبع قیمت',priceSrc)}${kv('اطمینان جهت‌دار',pct01(d.confidence))}${kv('سیگنال نهایی',fmtNum(d.final_signal,3))}${kv('اندازه پوزیشن',fmtNum(d.position,3))}${kv('رژیم',faRegime(reg.regime_label)+' · '+fmtNum(reg.regime_score,3))}${d.stop_loss?kv('حد ضرر',px(d.stop_loss)):''}${d.take_profit?kv('حد سود',px(d.take_profit)):''}</div></div></div>
<div class="card c5"><div class="head"><span>Bias مدل در برابر Signal معامله</span><span class="${bias.bias||'neutral'}">${faBias(bias.bias)}</span></div><div class="body note"><div class="metrics"><div class="metric"><div class="k">Bias خام مدل</div><div class="v ${bias.bias||'neutral'}">${faBias(bias.bias)}</div></div><div class="metric"><div class="k">Trade Signal</div><div class="v ${clsDir(d.direction)}">${faDir(d.direction)}</div></div><div class="metric"><div class="k">Gate</div><div class="v ${gateBlocked?'bad':'ok'}">${gateBlocked?'Blocked':'OK / Neutral'}</div></div></div><div class="warn">${(bias.block_reasons&&bias.block_reasons.length)?bias.block_reasons.map(x=>'• '+x).join('<br>'):(v.text||'—')}</div></div></div>
<div class="card c6"><div class="head"><span>حکم سیستم</span><span>${String(v.level||'').toUpperCase()}</span></div><div class="body note"><b>${v.text||'—'}</b><br>${(v.notes||[]).map(x=>'• '+x).join('<br>')}<div class="warn">معاملات مشابه: ${cmp.n_similar_trades??'—'} · نرخ برد هم‌جهت: ${cmp.historical_win_rate_same_direction ?? '—'} · شارپ: ${cmp.backtest_sharpe??'—'}</div></div></div>
<div class="card c6"><div class="head"><span>Trust Gate</span><span class="${(pipe.trust_gate?.level==='disabled')?'bad':(pipe.trust_gate?.level==='trusted')?'ok':'warn'}">${pipe.trust_gate?.level||'—'}</span></div><div class="body note"><b>${pipe.trust_gate?.message||'—'}</b><br>${(pipe.trust_gate?.reasons||[]).map(x=>'• '+x).join('<br>')}${(pipe.trust_gate?.warnings||[]).length?'<div class="warn">'+pipe.trust_gate.warnings.map(x=>'• '+x).join('<br>')+'</div>':''}</div></div>
<div class="card c6"><div class="head"><span>Data Provenance</span><span class="${p.synthetic_fallback?'bad':'ok'}">Synthetic: ${p.synthetic_fallback?'ON':'OFF'}</span></div><div class="body metrics">${metric('منبع داده',(p.source_exchanges||[]).join(', ')||'—',null)}${metric('آخرین کندل',p.last_candle||'—',null)}${metric('کندل‌ها',p.rows_dataset,null)}${metric('فیچرها',p.feature_count,null)}${metric('ردیف‌های آموزش‌پذیر',p.rows_labeled,null)}${metric('نوع مدل',p.model_type||meta.model_type||'—',null)}</div><div class="body note">Cache: <span class="mono">${p.cache_dir||'—'}</span><br>Model dir: <span class="mono">${p.model_dir||'—'}</span></div></div>
<div class="card c6"><div class="head"><span>Model Reality Check</span><span class="${modelUseful?'ok':'bad'}">Lift vs baseline: ${pct01(lift)}</span></div><div class="body metrics">${metric('Test accuracy',pct01(meta.test_accuracy),modelUseful)}${metric('Baseline test',pct01(meta.baseline_test_accuracy),null)}${metric('Majority class',faClass(meta.majority_class),null)}${metric('Valid accuracy',pct01(meta.valid_accuracy),null)}${metric('Train rows',meta.n_train,null)}${metric('Test rows',meta.n_test,null)}</div><div class="body note">اگر lift نزدیک صفر یا منفی باشد، accuracy بالا احتمالاً فقط نتیجه‌ی حدس زدن کلاس غالب است.</div></div>
<div class="card c12"><div class="head"><span>توزیع کلاس‌ها</span><button class="btn" onclick="load(current,true)">بازآموزی / اجرای force</button></div><div class="body">${classDist(meta)}</div></div>
<div class="card c12"><div class="head"><span>عملکرد و نتیجه معاملات بک‌تست</span><span>${ts.n_trades??trades.total??0} معامله کل</span></div><div class="body metrics wide">${metric('بازده استراتژی',pct(m.total_return),m.total_return>=0)}${metric('Buy & Hold',pct(m.buyhold_return),m.buyhold_return>=0)}${metric('Sharpe',fmtNum(m.sharpe,2),m.sharpe>=1)}${metric('Max DD',pct(m.max_drawdown),false)}${metric('سود ناخالص',money(ts.gross_profit),true)}${metric('ضرر ناخالص',money(-Math.abs(ts.gross_loss||0)),false)}${metric('سود/ضرر خالص',money(ts.net_pnl),Number(ts.net_pnl)>=0)}${metric('تغییر سرمایه',money(ts.equity_pnl),Number(ts.equity_pnl)>=0)}${metric('سرمایه اولیه',money(ts.initial_equity),null)}${metric('سرمایه نهایی',money(ts.final_equity),Number(ts.equity_pnl)>=0)}${metric('Win rate',fmtNum(m.win_rate,1)+'%',m.win_rate>=50)}${metric('Profit factor',fmtNum(m.profit_factor,2),m.profit_factor>=1)}${metric('Long/Short PnL',`${money(ts.long_pnl)} / ${money(ts.short_pnl)}`,null)}${metric('مدل',String(meta.trained_at||'').slice(0,16).replace('T',' '),null)}</div></div>
<div class="card c8"><div class="head">منحنی سرمایه</div><div class="body"><canvas id="chart" width="900" height="300"></canvas></div></div>
<div class="card c4"><div class="head">فیچرهای مهم</div><div class="body note">${(features.features||[]).slice(0,12).map(f=>`<div>${f.name}: <b class="mono">${fmtNum(f.importance,3)}</b></div>`).join('')||'—'}</div></div>
<div class="card c12"><div class="head"><span>معاملات بک‌تست</span><div class="pager"><span>صفحه ${pg.page||1} از ${pg.total_pages||1} · نمایش ${pg.returned||trades.returned||0} از ${pg.total||trades.total||0}</span><select class="select" onchange="changeLimit(this.value)"><option ${tradeLimit===20?'selected':''}>20</option><option ${tradeLimit===50?'selected':''}>50</option><option ${tradeLimit===100?'selected':''}>100</option></select><button class="btn" onclick="loadTradesPage(${(pg.page||1)-1})" ${pg.has_prev?'':'disabled'}>قبلی</button><button class="btn" onclick="loadTradesPage(${(pg.page||1)+1})" ${pg.has_next?'':'disabled'}>بعدی</button></div></div><div class="body"><table><thead><tr><th>#</th><th>جهت</th><th>زمان ورود</th><th>زمان خروج</th><th>ورود</th><th>خروج</th><th>سود/ضرر $</th><th>سود٪</th><th>دلیل</th></tr></thead><tbody>${(trades.trades||[]).map((t,i)=>`<tr><td class="mono">${(pg.offset||0)+i+1}</td><td><span class="pill ${clsDir(t.direction)}">${faDir(t.direction)}</span></td><td class="mono">${t.entry_time||'—'}</td><td class="mono">${t.exit_time||'—'}</td><td>${px(t.entry_price)}</td><td>${px(t.exit_price)}</td><td class="${pnlCls(t.pnl)}">${money(t.pnl)}</td><td class="${pnlCls(t.pnl_pct)}">${fmtNum(t.pnl_pct,3)}%</td><td>${t.exit_reason}</td></tr>`).join('')}</tbody></table></div></div>`;drawChart(equity);}
function kv(k,v){return `<div><div class="k">${k}</div><div class="v mono">${v}</div></div>`}
function metric(k,v,pos){return `<div class="metric"><div class="k">${k}</div><div class="v mono ${pos===null?'':pos?'long':'short'}">${v}</div></div>`}
function classDist(meta){const groups=[['Train',meta.train_class_distribution],['Valid',meta.valid_class_distribution],['Test',meta.test_class_distribution]];return `<div class="metrics">${groups.map(([name,g])=>`<div class="metric"><div class="k">${name}</div>${distRows(g)}</div>`).join('')}</div>`}
function distRows(g){if(!g||!g.pct)return '<div class="note">—</div>';return ['0','1','2'].map(c=>{const p=Number(g.pct[c]||0), n=g.count?.[c]||0;return `<div class="note">${faClass(c)}: <b class="mono">${(p*100).toFixed(1)}%</b> (${n})<div class="bar"><span style="width:${Math.max(2,p*100)}%"></span></div></div>`}).join('')}
function drawChart(eq){const c=document.getElementById('chart');if(!c||!eq.strategy?.length)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const vals=[...eq.strategy,...eq.buyhold].filter(Number.isFinite);const min=Math.min(...vals),max=Math.max(...vals),pad=24;function y(v){return c.height-pad-((v-min)/(max-min||1))*(c.height-pad*2)}function x(i,n){return pad+i/(n-1||1)*(c.width-pad*2)}ctx.strokeStyle='#263445';ctx.lineWidth=1;for(let i=0;i<5;i++){let yy=pad+i*(c.height-pad*2)/4;ctx.beginPath();ctx.moveTo(pad,yy);ctx.lineTo(c.width-pad,yy);ctx.stroke()}function line(arr,color){ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();arr.forEach((v,i)=>{const xx=x(i,arr.length),yy=y(v);if(i)ctx.lineTo(xx,yy);else ctx.moveTo(xx,yy)});ctx.stroke()}line(eq.buyhold,'#7d8b9d');line(eq.strategy,'#ffb000');}
renderTabs();load(current,false);
</script>
</body>
</html>
