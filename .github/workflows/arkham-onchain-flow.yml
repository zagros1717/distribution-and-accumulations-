name: Arkham BTC exchange-flow report

on:
  schedule:
    # Runs daily at 00:15 UTC.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build read-only Arkham BTC flow report
        run: |
          python main.py onchain-flow

      - name: Commit daily report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/onchain/*.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add daily Arkham BTC exchange-flow report"
            git push
          fi
