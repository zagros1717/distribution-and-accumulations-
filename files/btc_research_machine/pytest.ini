[pytest]
# Project tests live in ./tests. Tests assume the repo root is on sys.path,
# which tests/conftest.py arranges.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio: keep STRICT mode (each async test must be decorated with
# @pytest.mark.asyncio). This is explicit and prevents accidentally running
# sync code on the event loop.
asyncio_mode = strict

# Filter the noisy pyarrow / pandas FutureWarnings we don't control.
filterwarnings =
    ignore::DeprecationWarning:pkg_resources
